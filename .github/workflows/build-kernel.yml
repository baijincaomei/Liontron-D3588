name: Build RK3588 Kernel with NPU 0.9.8 for Liontron-D3588

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout your Kernel Source
        uses: actions/checkout@v4
        with:
          repository: baijincaomei/Liontron-D3588
          path: liontron-kernel

      - name: Checkout Rockchip Kernel
        uses: actions/checkout@v4
        with:
          repository: rockchip-linux/kernel
          ref: develop-5.10
          path: kernel

      - name: Replace NPU Driver
        run: |
          cd kernel
          # 解压驱动
          cp ../liontron-kernel/kernel-5.10.198/rknpu_driver_0.9.8_20241009.tar.bz2 .
          tar -xvjf rknpu_driver_0.9.8_20241009.tar.bz2
          
          # 删除旧的 drivers/rknpu
          rm -rf drivers/rknpu
          
          # 复制新的驱动（根据解压结果选择路径）
          if [ -d "rknpu_driver_0.9.8/drivers/rknpu" ]; then
            cp -rf rknpu_driver_0.9.8/drivers/rknpu drivers/
          elif [ -d "drivers/rknpu" ]; then
            # 已经在了，什么都不做
            echo "驱动已就位"
          else
            echo "错误：找不到驱动"
            exit 1
          fi
          
          ls -la drivers/rknpu/
          
          # 复制设备树
          cp ../liontron-kernel/kernel-5.10.198/rk3588-liontron-d3588.dts arch/arm64/boot/dts/rockchip/

      - name: Apply Patches
        run: |
          cd kernel
          # 修补 devfreq.c
          if [ -f drivers/rknpu/rknpu_devfreq.c ]; then
            sed -i '/\.set_soc_info = rockchip_opp_set_low_length,/s/^/\/\/ /' drivers/rknpu/rknpu_devfreq.c
          fi
          # 修补 mm.h
          if ! grep -q "vm_flags_set" include/linux/mm.h; then
            cat >> include/linux/mm.h << 'EOF'
          
          static inline void vm_flags_set(struct vm_area_struct *vma, vm_flags_t flags)
          {
              vma->vm_flags |= flags;
          }
          
          static inline void vm_flags_clear(struct vm_area_struct *vma, vm_flags_t flags)
          {
              vma->vm_flags &= ~flags;
          }
          EOF
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc kmod cpio libssl-dev libelf-dev device-tree-compiler

      - name: Configure Kernel
        run: |
          cd kernel
          make rockchip_linux_defconfig
          scripts/config --module CONFIG_ROCKCHIP_NPU 2>/dev/null || true

      - name: Build
        run: |
          cd kernel
          make -j$(nproc) Image dtbs
          make modules -j$(nproc)

      - name: Package
        run: |
          cd kernel
          mkdir -p output
          cp arch/arm64/boot/Image output/
          cp arch/arm64/boot/dts/rockchip/rk3588-liontron-d3588.dtb output/
          tar -czf output/modules.tar.gz lib/modules/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: liontron-kernel-with-npu-0.9.8
          path: kernel/output/
