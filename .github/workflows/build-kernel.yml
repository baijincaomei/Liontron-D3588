name: Build RK3588 Kernel with Built-in NPU 0.9.8

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  # 解决 GCC 13 报错的关键环境变量
  KCFLAGS: "-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-unused-result"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Assets (Contains d3588.sh and Driver)
        uses: actions/checkout@v4
        with:
          repository: baijincaomei/Liontron-D3588
          path: liontron-assets  # 对应原脚本中的基础资源目录

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc kmod cpio libssl-dev \
          libelf-dev device-tree-compiler gcc-aarch64-linux-gnu git python3 u-boot-tools

      - name: Clone Kernel Source
        run: |
          # 按照原脚本逻辑克隆内核
          git clone --depth=1 https://github.com/yifengyou/d3588-kernel-5.10.198.git kernel
          
      - name: Integrate NPU 0.9.8 & Setup Build Script
        run: |
          # 1. 替换 NPU 驱动
          echo "Upgrading NPU to 0.9.8..."
          rm -rf kernel/drivers/rknpu/*
          tar -xvjf liontron-assets/kernel-5.10.198/rknpu_driver_0.9.8_20241009.tar.bz2 -C kernel/
          
          # 2. 注入设备树并注册 Makefile
          cp liontron-assets/kernel-5.10.198/rk3588-liontron-d3588.dts kernel/arch/arm64/boot/dts/rockchip/
          if ! grep -q "rk3588-liontron-d3588.dtb" kernel/arch/arm64/boot/dts/rockchip/Makefile; then
            sed -i "/dtb-\$(CONFIG_ARCH_ROCKCHIP) +=/a \	dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3588-liontron-d3588.dtb" kernel/arch/arm64/boot/dts/rockchip/Makefile
          fi

          # 3. 准备编译脚本 (核心修复：从资源目录复制 d3588.sh 到内核目录)
          # 根据你提供的链接，d3588.sh 应该在 liontron-assets 的相关路径下
          # 如果资源包里已经有这个脚本，我们把它拷贝进去
          cp liontron-assets/kernel-5.10.198/d3588.sh kernel/ || echo "d3588.sh already in repo or missing in assets"
          
          # 4. 强制配置 NPU 为内置
          cd kernel
          make rockchip_linux_defconfig
          ./scripts/config --enable CONFIG_ROCKCHIP_NPU
          make olddefconfig
          
          # 5. 修复代码兼容性补丁
          if [ -f drivers/rknpu/rknpu_devfreq.c ]; then
            sed -i '/\.set_soc_info = rockchip_opp_set_low_length,/s/^/\/\/ /' drivers/rknpu/rknpu_devfreq.c
          fi

      - name: Execute Kernel Build
        run: |
          cd kernel
          # 再次确认脚本权限并运行
          chmod +x d3588.sh
          ./d3588.sh

      - name: Package Results
        run: |
          mkdir -p release
          # 提取 Image, DTB 和编译出的 boot.img
          find kernel/arch/arm64/boot/ -name "Image" -exec cp {} release/ \;
          find kernel/arch/arm64/boot/dts/rockchip/ -name "rk3588-liontron-d3588.dtb" -exec cp {} release/ \;
          [ -f kernel/boot.img ] && cp kernel/boot.img release/
          ls -lh release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liontron-D3588-NPU0.9.8-BuiltIn
          path: release/
