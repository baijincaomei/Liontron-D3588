# .github/workflows/build-kernel.yml
name: Build RK3588 Kernel with NPU 0.9.8

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  KERNEL_DIR: kernel-5.10.198

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: baijincaomei/Liontron-D3588
          path: kernel-source

      - name: Extract NPU Driver from Local File
        run: |
          cd kernel-source/${{ env.KERNEL_DIR }}
          # 解压你上传的驱动包
          tar -xvjf rknpu_driver_0.9.8_20241009.tar.bz2
          echo "=== 解压后的内容 ==="
          ls -la
          echo "=== 查找 drivers 目录 ==="
          find . -name "drivers" -type d

      - name: Install NPU Driver to Kernel
        run: |
          cd kernel-source/${{ env.KERNEL_DIR }}
          
          # 根据解压结果，将驱动文件放到正确位置
          if [ -d "rknpu_driver_0.9.8/drivers/rknpu" ]; then
            echo "找到驱动目录: rknpu_driver_0.9.8/drivers/rknpu"
            mkdir -p drivers
            cp -rf rknpu_driver_0.9.8/drivers/rknpu drivers/
          elif [ -d "drivers/rknpu" ]; then
            echo "驱动已在 drivers/rknpu 目录"
          else
            echo "尝试查找 rknpu 相关目录"
            find . -name "rknpu" -type d
            # 如果都没有，尝试直接复制当前目录下的所有 .c .h 文件
            mkdir -p drivers/rknpu
            cp -f *.c *.h Makefile Kconfig drivers/rknpu/ 2>/dev/null || true
            [ -d "include" ] && cp -rf include drivers/rknpu/
          fi
          
          echo "=== drivers/rknpu 目录内容 ==="
          ls -la drivers/rknpu/

      - name: Apply Kernel Patches
        run: |
          cd kernel-source/${{ env.KERNEL_DIR }}
          
          # 查找并修补 rknpu_devfreq.c
          NPU_DEVFREQ_C=$(find . -name "rknpu_devfreq.c" | head -1)
          if [ -n "$NPU_DEVFREQ_C" ]; then
            echo "修补文件: $NPU_DEVFREQ_C"
            sed -i '/\.set_soc_info = rockchip_opp_set_low_length,/s/^/\/\/ /' $NPU_DEVFREQ_C
          fi
          
          # 修补 mm.h
          MM_H="include/linux/mm.h"
          if [ -f "$MM_H" ] && ! grep -q "vm_flags_set" $MM_H; then
            cat >> $MM_H << 'EOF'
          
          static inline void vm_flags_set(struct vm_area_struct *vma, vm_flags_t flags)
          {
              vma->vm_flags |= flags;
          }
          
          static inline void vm_flags_clear(struct vm_area_struct *vma, vm_flags_t flags)
          {
              vma->vm_flags &= ~flags;
          }
          EOF
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc kmod cpio \
            libssl-dev libelf-dev device-tree-compiler

      - name: Configure Kernel
        run: |
          cd kernel-source/${{ env.KERNEL_DIR }}
          make defconfig

      - name: Build Kernel
        run: |
          cd kernel-source/${{ env.KERNEL_DIR }}
          make -j$(nproc)
          make modules -j$(nproc)

      - name: Package Artifacts
        run: |
          cd kernel-source/${{ env.KERNEL_DIR }}
          mkdir -p ../output
          [ -f arch/arm64/boot/Image ] && cp arch/arm64/boot/Image ../output/
          [ -d arch/arm64/boot/dts/rockchip ] && cp arch/arm64/boot/dts/rockchip/*.dtb ../output/ 2>/dev/null || true
          [ -d lib/modules ] && tar -czf ../output/modules.tar.gz lib/modules/ 2>/dev/null || true
          echo "编译产物已打包"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-with-npu-0.9.8
          path: kernel-source/output/
