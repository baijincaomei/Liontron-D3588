name: Build RK3588 Kernel with NPU 0.9.8 for Liontron-D3588

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout your Kernel Source
        uses: actions/checkout@v4
        with:
          repository: baijincaomei/Liontron-D3588
          path: liontron-kernel

      - name: Checkout Rockchip Kernel
        uses: actions/checkout@v4
        with:
          repository: rockchip-linux/kernel
          ref: develop-5.10
          path: kernel

      - name: Extract NPU Driver and DTB
        run: |
          cd kernel
          
          # 查找官方内核中 NPU 驱动的实际位置
          echo "=== 查找官方 NPU 驱动位置 ==="
          find drivers/ -name "rknpu_drv.c" 2>/dev/null || echo "未找到 rknpu_drv.c"
          find drivers/ -type d -name "*npu*" 2>/dev/null
          
          # 复制并解压驱动包
          cp ../liontron-kernel/kernel-5.10.198/rknpu_driver_0.9.8_20241009.tar.bz2 .
          tar -xvjf rknpu_driver_0.9.8_20241009.tar.bz2
          
          # 确定新驱动的源目录
          if [ -d "drivers/rknpu" ]; then
            NEW_DRIVER="drivers/rknpu"
          else
            NEW_DRIVER="rknpu_driver_0.9.8/drivers/rknpu"
          fi
          
          # 确定官方内核的目标目录
          if [ -d "drivers/rknpu" ]; then
            TARGET_DIR="drivers/rknpu"
          elif [ -d "drivers/rockchip/npu" ]; then
            TARGET_DIR="drivers/rockchip/npu"
          else
            # 如果都不存在，创建一个
            echo "创建 drivers/rknpu 目录"
            mkdir -p drivers/rknpu
            TARGET_DIR="drivers/rknpu"
          fi
          
          echo "新驱动源: $NEW_DRIVER"
          echo "目标目录: $TARGET_DIR"
          
          # 备份并替换
          [ -d "$TARGET_DIR" ] && cp -r $TARGET_DIR ${TARGET_DIR}_backup
          rm -rf $TARGET_DIR
          cp -rf $NEW_DRIVER $TARGET_DIR
          
          ls -la $TARGET_DIR
          
          # 复制设备树文件
          cp ../liontron-kernel/kernel-5.10.198/rk3588-liontron-d3588.dts arch/arm64/boot/dts/rockchip/

      - name: Apply Kernel Patches
        run: |
          cd kernel
          # 找到并修补 rknpu_devfreq.c
          NPU_FILE=$(find drivers/ -name "rknpu_devfreq.c" | head -1)
          if [ -n "$NPU_FILE" ]; then
            sed -i '/\.set_soc_info = rockchip_opp_set_low_length,/s/^/\/\/ /' $NPU_FILE
          fi
          # 修补 mm.h
          if ! grep -q "vm_flags_set" include/linux/mm.h; then
            cat >> include/linux/mm.h << 'EOF'
          
          static inline void vm_flags_set(struct vm_area_struct *vma, vm_flags_t flags)
          {
              vma->vm_flags |= flags;
          }
          
          static inline void vm_flags_clear(struct vm_area_struct *vma, vm_flags_t flags)
          {
              vma->vm_flags &= ~flags;
          }
          EOF
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc kmod cpio libssl-dev libelf-dev device-tree-compiler

      - name: Configure Kernel
        run: |
          cd kernel
          make rockchip_linux_defconfig
          scripts/config --module CONFIG_ROCKCHIP_NPU 2>/dev/null || true

      - name: Build Kernel and DTB
        run: |
          cd kernel
          make -j$(nproc) Image dtbs
          make modules -j$(nproc)

      - name: Package Artifacts
        run: |
          cd kernel
          mkdir -p output
          cp arch/arm64/boot/Image output/
          cp arch/arm64/boot/dts/rockchip/rk3588-liontron-d3588.dtb output/
          tar -czf output/modules.tar.gz lib/modules/ 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liontron-kernel-with-npu-0.9.8
          path: kernel/output/
