      - name: Apply Patches
        run: |
          cd kernel
          
          # 补丁1: 注释 rknpu_devfreq.c 中的问题行
          if [ -f drivers/rknpu/rknpu_devfreq.c ]; then
            echo "修补 rknpu_devfreq.c"
            sed -i '/\.set_soc_info = rockchip_opp_set_low_length,/s/^/\/\/ /' drivers/rknpu/rknpu_devfreq.c
          fi
          
          # 补丁2: 只有当函数不存在时才添加（避免重复定义）
          echo "检查 mm.h 中的 vm_flags_set..."
          if ! grep -q "vm_flags_set" include/linux/mm.h; then
            echo "添加 vm_flags_set 和 vm_flags_clear"
            cat >> include/linux/mm.h << 'EOF'
          
          static inline void vm_flags_set(struct vm_area_struct *vma, vm_flags_t flags)
          {
              vma->vm_flags |= flags;
          }
          
          static inline void vm_flags_clear(struct vm_area_struct *vma, vm_flags_t flags)
          {
              vma->vm_flags &= ~flags;
          }
          EOF
          else
            echo "vm_flags_set 已存在，跳过添加"
          fi
          
          echo "✅ 补丁已应用"
