# .github/workflows/build-kernel.yml
name: Build RK3588 Kernel with NPU 0.9.8

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04-arm
    steps:
      # 1. 获取你的 Liontron-D3588 内核源码
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: yifengyou/Liontron-D3588
          path: kernel

      # 2. 获取 rknn-llm 仓库（包含 NPU 驱动源码）
      - name: Checkout RKNN-LLM for NPU Driver
        uses: actions/checkout@v4
        with:
          repository: airockchip/rknn-llm
          path: rknn-llm

      # 3. 解压 NPU 驱动源码
      - name: Extract NPU Driver
        run: |
          cd rknn-llm/rknpu-driver
          tar -xvjf rknpu_driver_0.9.8_20241009.tar.bz2

      # 4. 替换 NPU 驱动到内核源码
      - name: Replace NPU Driver
        run: |
          cd kernel
          # 备份原有驱动
          cp -r drivers/rknpu drivers/rknpu_backup
          # 删除并替换为新驱动
          rm -rf drivers/rknpu
          cp -rf ../rknn-llm/rknpu-driver/rknpu_driver_0.9.8/drivers/rknpu drivers/

      # 5. 安装编译依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc kmod cpio \
            libssl-dev libelf-dev device-tree-compiler

      # 6. 配置内核（使用你设备的默认配置）
      - name: Configure Kernel
        run: |
          cd kernel
          # 假设你的仓库中有设备配置，根据实际情况调整
          if [ -f arch/arm64/configs/rockchip_linux_defconfig ]; then
            make rockchip_linux_defconfig
          else
            make defconfig
          fi

      # 7. 编译内核
      - name: Build Kernel
        run: |
          cd kernel
          make -j$(nproc)
          make modules -j$(nproc)

      # 8. 打包编译产物
      - name: Package Artifacts
        run: |
          cd kernel
          mkdir -p ../output
          cp arch/arm64/boot/Image ../output/
          cp arch/arm64/boot/dts/rockchip/*.dtb ../output/
          tar -czf ../output/modules.tar.gz lib/modules/

      # 9. 上传编译结果
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-with-npu-0.9.8
          path: output/
